<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #5b6270;
    --border: #dfe3e8;

    --chip-bg: #eef2ff;
    --chip-text: #2c3e8f;
    --image-bg: #eceef2;
    --titlebar-bg: #e7e9ee;
    --selection: #c9d7fb;

    /* 字級：只用這 6 階 */
    --fs-xs: 13px;
    --fs-sm: 14px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
    --fs-xl: 30px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: var(--fs-base);
    accent-color: var(--accent);
  }
  ::selection { background: var(--selection); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font-family: inherit; }
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: relative;
    padding: 44px 24px 26px;
    text-align: center;
  }
  .header-topright {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 6;
  }
  .lang-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .lang-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text-muted);

    font-weight: 700;
    padding: 7px 13px;
    cursor: pointer;
  }
  .lang-btn:focus-visible { outline-offset: -3px; }
  .lang-btn + .lang-btn { border-left: 1.5px solid var(--border); }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .leaderboard-btn {
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--text);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .leaderboard-btn:hover { border-color: var(--accent); color: var(--accent); }
  .version-toggle { position: relative; margin: 0; }
  .version-toggle summary {
    list-style: none;
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    color: var(--chip-text);
    font-size: var(--fs-xs);
    font-weight: 700;

  }
  .version-toggle summary::-webkit-details-marker { display: none; }
  .changelog-box {

    right: 0;

    max-width: calc(100vw - 32px);

  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }

  /* ---------- grid / cards ---------- */
  main { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

  .card {

    background: var(--card-bg);

    flex-direction: column;
  }
  .card:hover { border-color: var(--accent); }
  .card:has(.card-link:focus-visible) { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-link { color: inherit; text-decoration: none; }
  .card-link:focus-visible { outline: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card .browser-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--titlebar-bg);
    border-bottom: 1.5px solid var(--border);
  }
  .card .traffic-lights { display: flex; gap: 6px; flex-shrink: 0; }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; }
  .card .dot.red { background: #ff5f57; }
  .card .dot.yellow { background: #febc2e; }
  .card .dot.green { background: #28c840; }
  .card .url-pill {

    border-radius: 6px;
    padding: 5px 10px;
    font-size: var(--fs-xs);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .case-number {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .card .thumb {
    width: 100%;
    height: 180px;
    background: var(--image-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card .thumb .placeholder { color: var(--text-muted); font-size: var(--fs-sm); }
  .card .body { padding: 18px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .card .type-badge {
    display: inline-block;
    align-self: flex-start;
    background: var(--chip-bg);
    color: var(--chip-text);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .card h3 { margin: 0; font-size: var(--fs-md); font-weight: 700; line-height: 1.35; }
  .card .summary {
    font-size: var(--fs-sm);
    color: var(--text-muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;

  .card .meta { font-size: var(--fs-xs); color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: var(--chip-bg); color: var(--chip-text); font-size: var(--fs-xs); font-weight: 600; padding: 4px 11px; border-radius: 999px; }
  #empty { text-align: center; color: var(--text-muted); font-size: var(--fs-base); padding: 60px 0; display: none; }

  /* 載入中的骨架卡片 */
  .card.skeleton { cursor: default; }
  .card.skeleton:hover { border-color: var(--border); }
  .sk-line { display: block; height: 14px; border-radius: 6px; background: var(--image-bg); }
  .sk-line.title { height: 20px; width: 75%; }
  .sk-line.short { width: 45%; }
  .card.skeleton .thumb, .card.skeleton .sk-line { animation: sk-pulse 1.4s ease-in-out infinite; }
  @keyframes sk-pulse { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) {
    .card.skeleton .thumb, .card.skeleton .sk-line { animation: none; }
  }
  .load-error {
    grid-column: 1 / -1;

    font-size: var(--fs-base);

    color: var(--text);
    font-size: var(--fs-sm);
    font-weight: 600;

  .pagination button:hover:not(:disabled) { border-color: var(--accent); }
  .pagination button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .pagination .ellipsis { color: var(--text-muted); padding: 0 4px; }

  /* ---------- detail view (full page, no overlay) ---------- */

  .detail-topbar { position: sticky; top: 0; background: var(--bg); padding: 16px 0; z-index: 5; }

    font-weight: 600;
    cursor: pointer;
  }
  #backBtn:hover, #leaderboardBackBtn:hover { border-color: var(--accent); color: var(--accent); }

  .hero {
    width: 100%;
    max-height: 60vh;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .hero img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }

  .gallery { margin-bottom: 20px; }
  .gallery-main {
    width: 100%;
    max-height: 60vh;
    padding: 0;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;

  }
  .gallery-main img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .gallery-thumbs {
    display: flex;
    gap: 8px;

  .gallery-thumb {

    height: 54px;

  .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-thumb:hover, .gallery-thumb:focus-visible { opacity: 1; }

  .lightbox {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

  }
  .lightbox[hidden] { display: none; }
  .lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; }
  .lightbox-close, .lightbox-nav {
    position: absolute;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 50%;

    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255, 255, 255, 0.25); }
  .lightbox :focus-visible { outline-color: #fff; }
  .lightbox-close { top: 18px; right: 18px; width: 44px; height: 44px; }
  .lightbox-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 30px; }
  .lightbox-prev { left: 18px; }
  .lightbox-next { right: 18px; }
  .lightbox-counter {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.12);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .video-embed {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .detail-title { margin: 0 0 10px; font-size: var(--fs-xl); line-height: 1.35; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .detail-title:focus { outline: none; }
  #detailContent .subtitle { color: var(--text-muted); font-size: var(--fs-md); line-height: 1.65; margin: 0 0 24px; }

  .leaderboard-wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  .leaderboard-wrap h1 { margin: 0 0 8px; font-size: var(--fs-xl); line-height: 1.35; font-weight: 800; text-align: center; }
  .leaderboard-wrap .subtitle { color: var(--text-muted); font-size: var(--fs-md); line-height: 1.65; margin: 0 0 28px; text-align: center; }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 14px;

  .lb-count {

  #detailContent .case-number {
    display: inline-block;

    color: #fff;
    font-size: var(--fs-xs);

    padding: 4px 12px;

  /* 成效摘要：執行成果＋產生價值，放在最前面 */
  .highlights {

    #grid { grid-template-columns: 1fr; gap: 16px; }
    .card .thumb { height: 200px; }
    .detail-title, .leaderboard-wrap h1 { font-size: var(--fs-lg); }
    .meta-grid { grid-template-columns: repeat(2, 1fr); }

    #backBtn, #leaderboardBackBtn { min-height: 44px; }

    #searchClear { width: 44px; height: 44px; right: 4px; }

  @media (pointer: coarse) and (max-width: 600px) {
    header { padding-top: 76px; }

  /* ===== 入口密碼畫面 ===== */
  #gate { display: none; }
  html.gate-locked body > :not(#gate) { display: none !important; }
  html.gate-locked #gate {
    display: grid;

  .gate-brand {

            mask-image: linear-gradient(to bottom, transparent 20%, #000 60%, transparent);

  .gate-blob { position: absolute; z-index: -1; border-radius: 50%; filter: blur(2px); opacity: .55; animation: gateDrift 14s ease-in-out infinite; }
  .gate-blob.b1 { width: 230px; height: 230px; right: -70px; top: -60px; background: #ffe08a; }

  .gate-blob.b3 { width: 96px; height: 96px; right: 30%; top: 38%; background: #ffc6d9; animation-delay: -9s; }

  .gate-lockup { display: flex; align-items: center; gap: 14px; }

  .gate-lockup strong { display: block; color: #111c2f; font-size: 18px; letter-spacing: .16em; }
  .gate-lockup span { display: block; margin-top: 3px; color: #4e6078; font: 10px Arial, sans-serif; letter-spacing: .42em; }

  .gate-brand h1 {
    margin: clamp(22px, 4vh, 44px) 0 0;
    color: #0b2e64;
    font-size: clamp(34px, 3.3vw, 56px);

  .gate-brand h1 mark {

  .gate-desc { margin: 16px 0 0; max-width: 34em; color: #4f6785; font-size: clamp(15px, 1.1vw, 18px); line-height: 1.75; }

  .gate-scene { position: relative; flex: 1; min-height: 340px; margin-top: 12px; }
  .gate-scene::before {
    content: "";
    position: absolute; left: 50%; bottom: -70px; width: 120%; height: 190px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);

  .gate-mascot {
    position: absolute; right: 8%; bottom: -2%; margin: 0;
    height: min(100%, 470px); aspect-ratio: 520 / 818;
    filter: drop-shadow(0 22px 20px rgba(30,82,140,.22));

  }
  .gate-mascot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .gate-mascot.cheer { animation: gateCheer .7s ease-in-out 2; }

  .gate-bubble {

  .gate-chip {
    position: absolute;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 10px 22px rgba(35,75,122,.13);

  }
  .gate-chip.c1 { left: 2%;  bottom: 18%; color: #1d4ea8; background: #e3eeff; --r: -6deg; }
  .gate-chip.c2 { left: 26%; bottom: 6%;  color: #8a5a00; background: #fff1c4; --r: 4deg;  animation-delay: -1.2s; }
  .gate-chip.c3 { left: 6%;  bottom: 80%; color: #1c6b2c; background: #dff6e2; --r: 5deg;  animation-delay: -2.4s; }
  .gate-chip.c4 { right: 2%; bottom: 86%; color: #a3305c; background: #ffe3ec; --r: -4deg; animation-delay: -3.1s; }

  .gate-panel {

  .gate-field {
    display: flex; align-items: center; height: 62px; padding: 0 8px 0 16px;

  }
  .gate-field:focus-within { border-color: #4a88dc; box-shadow: 0 0 0 4px rgba(27,105,213,.1); }
  .gate-field.invalid { border-color: #d55763; box-shadow: 0 0 0 4px rgba(213,87,99,.09); }
  .gate-field svg { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: #718099; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .gate-field input {
    flex: 1; min-width: 0; height: 100%; padding: 0 12px;

  .gate-field input::placeholder { color: #a2adbc; letter-spacing: 0; }
  .gate-eye { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 10px; color: #6f7e95; background: transparent; cursor: pointer; }
  .gate-eye:hover { color: #0d5bd7; background: #f1f6fd; }
  .gate-eye svg { grid-area: 1 / 1; stroke: currentColor; }
  .gate-eye .eye-closed, .gate-eye[aria-pressed="true"] .eye-open { display: none; }
  .gate-eye[aria-pressed="true"] .eye-closed { display: block; }
  .gate-error { min-height: 22px; margin: 8px 2px 10px; color: #c83c4d; font-size: 14px; }
  .gate-submit {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 62px; overflow: hidden;
    border: 0; border-radius: 14px;
    color: #fff; background: linear-gradient(100deg, #1668e3 0%, #0643a5 100%);
    box-shadow: 0 12px 24px rgba(13,81,188,.22);
    font: inherit; font-size: 18px; font-weight: 800; letter-spacing: .08em;
    cursor: pointer; transition: transform .18s, box-shadow .18s;
  }
  .gate-submit::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,.26) 50%, transparent 75%);
    transform: translateX(-120%); transition: transform .6s;
  }
  .gate-submit:hover { transform: translateY(-2px); box-shadow: 0 16px 28px rgba(13,81,188,.28); }
  .gate-submit:hover::before { transform: translateX(120%); }
  .gate-submit:active { transform: translateY(0) scale(.99); }
  .gate-submit:disabled { opacity: .75; cursor: default; }
  .gate-submit svg { width: 20px; height: 20px; fill: none; stroke: #ffe08a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
  .gate-submit:hover svg { transform: translateX(4px); }
  .gate-foot { margin-top: 30px; text-align: center; color: #718099; }
  .gate-foot p { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; font-size: 13px; }
  .gate-foot svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .gate-foot small { display: block; margin-top: 8px; font-size: 12px; color: #94a1b5; }
  #gate :focus-visible { outline: 3px solid rgba(13,91,215,.4); outline-offset: 2px; }
  #gate .gate-field input:focus-visible { outline: 0; }

  .gate-confetti { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .gate-confetti i {
    position: absolute; top: -16px; width: 10px; height: 16px; border-radius: 3px;
    animation: gateConfetti var(--d, 1.4s) cubic-bezier(.2,.6,.4,1) var(--delay, 0s) forwards;
  }

  @keyframes gateBob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-14px) rotate(1.2deg); } }
  @keyframes gateCheer { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-34px) scale(1.04, .98); } 70% { transform: translateY(0) scale(.98, 1.03); } }
  @keyframes gateNope { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  @keyframes gateFloat { 0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-10px) rotate(var(--r, 0deg)); } }
  @keyframes gateDrift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-18px) scale(1.08); } }
  @keyframes gatePop { from { opacity: 0; transform: scale(.7) translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes gatePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  @keyframes gateShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  @keyframes gateConfetti { to { transform: translate(var(--x, 0), 105vh) rotate(var(--rot, 540deg)); opacity: .9; } }

  @media (max-width: 1180px) {
    .gate-chip.c2, .gate-chip.c5 { display: none; }
    .gate-mascot { right: 2%; }
    .gate-bubble { right: calc(2% + min(290px, 30vw)); }
  }
  @media (max-width: 860px) {
    html.gate-locked #gate { display: block; overflow: visible; background: linear-gradient(160deg, #e6f3ff, #f8fbff 45%, #eaf5ff); }
    .gate-brand { padding: 22px 20px 0; background: transparent; overflow: visible; }
    .gate-brand::before, .gate-blob.b3, .gate-chip { display: none; }
    .gate-lockup img { width: 44px; height: 44px; }
    .gate-lockup strong { font-size: 15px; }
    .gate-brand h1 { margin-top: 18px; font-size: clamp(26px, 7.4vw, 36px); }
    .gate-desc { margin-top: 10px; font-size: 14px; }
    .gate-scene { display: flex; align-items: flex-end; justify-content: center; gap: 6px; min-height: 0; height: 150px; margin-top: 8px; }
    .gate-scene::before { display: none; }
    .gate-mascot { position: relative; right: auto; bottom: auto; order: 2; height: 150px; flex: 0 0 auto; margin-bottom: -18px; z-index: 2; }
    .gate-bubble { position: relative; right: auto; bottom: auto; order: 1; max-width: 220px; margin-bottom: 38px; padding: 11px 14px; font-size: 14px; }
    .gate-panel { padding: 0 16px 28px; background: transparent; }
    .gate-card { padding: 54px 22px 24px; border-radius: 22px; }
    .gate-head p { margin-bottom: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #gate *, #gate *::before, #gate *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="gate">
  <section class="gate-brand" aria-labelledby="gateTitle">
    <i class="gate-blob b1" aria-hidden="true"></i>
    <i class="gate-blob b2" aria-hidden="true"></i>

</div>

function loc(c) { return c.i18n[currentLang] || c.i18n.zh; }

function renderSkeleton() {
  const grid = document.getElementById('grid');
  const card = `
    <div class="card skeleton" aria-hidden="true">
      <div class="browser-bar"><div class="traffic-lights"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div></div>
      <div class="thumb"></div>
      <div class="body"><span class="sk-line title"></span><span class="sk-line"></span><span class="sk-line short"></span></div>
    </div>`;
  grid.setAttribute('aria-busy', 'true');
  grid.innerHTML = card.repeat(6);
}

function renderLoadError() {
  const grid = document.getElementById('grid');
  grid.setAttribute('aria-busy', 'false');
  grid.innerHTML = `<div class="load-error" role="alert">${escapeHtml(ui().loadError)}<br><button type="button" id="retryLoad">${escapeHtml(ui().retry)}</button></div>`;
  document.getElementById('retryLoad').addEventListener('click', load);
}

async function load() {
  applyStaticText();
  renderSkeleton();
  try {
    const [casesRes, changelogRes] = await Promise.all([
      fetch('data/cases.json'),
      fetch('data/changelog.json')
    ]);
    if (!casesRes.ok) throw new Error('cases.json ' + casesRes.status);
    cases = await casesRes.json();
    changelogData = changelogRes.ok ? await changelogRes.json() : null;
  } catch (err) {
    console.error(err);
    renderLoadError();
    return;
  }
  document.getElementById('grid').setAttribute('aria-busy', 'false');
  applyStaticText();
  renderVersion();
  renderCategoryFilters();
  render();
  routeFromHash();
}

function applyStaticText() {
  const s = ui();
  document.title = s.pageTitle;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
  document.getElementById('pageTitle').textContent = s.pageTitle;
  document.getElementById('pageSubtitle').textContent = s.subtitle;
  document.getElementById('search').placeholder = s.searchPlaceholder;
  document.getElementById('searchLabel').textContent = s.searchLabel;
  document.getElementById('searchClear').setAttribute('aria-label', s.clearSearch);
  document.getElementById('searchClear').title = s.clearSearch;
  document.getElementById('categoryFilters').setAttribute('aria-label', s.filterGroup);
  document.getElementById('listHeading').textContent = s.listHeading;
  document.getElementById('pagination').setAttribute('aria-label', s.paginationLabel);
  document.querySelector('.lang-toggle').setAttribute('aria-label', s.langGroup);
  document.getElementById('empty').textContent = s.empty;
  document.getElementById('backBtn').textContent = s.backBtn;
  document.getElementById('leaderboardBackBtn').textContent = s.backBtn;
  document.getElementById('leaderboardBtn').textContent = s.leaderboardBtn;
  document.getElementById('lightbox').setAttribute('aria-label', s.lightboxLabel);
  document.getElementById('lightboxClose').setAttribute('aria-label', s.close);
  document.getElementById('lightboxPrev').setAttribute('aria-label', s.prevImage);
  document.getElementById('lightboxNext').setAttribute('aria-label', s.nextImage);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const on = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on);
  });
}

function updateCount(shown) {
  const s = ui();
  document.getElementById('totalCount').textContent =
    shown === cases.length ? s.totalCount(cases.length) : s.shownCount(shown, cases.length);
}

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  localStorage.setItem('caseLibLang', lang);
  activeCategory = null;
  currentPage = 1;
  applyStaticText();
  renderVersion();
  renderCategoryFilters();
  render();
  routeFromHash();
}

function domainFromUrl(url) {
  if (!url) return ui().noUrl;
  try {
    const u = new URL(url);
    const path = u.pathname.replace(/\/$/, '');
    return u.hostname + path;
  } catch (e) {
    return url;
  }
}

function renderVersion() {
  if (!changelogData) return;
  document.getElementById('versionBadge').textContent = changelogData.version;
  document.getElementById('changelogHeader').innerHTML =
    `<div class="date">${escapeHtml(ui().currentVersion)}</div><div class="notes">${escapeHtml(changelogData.version)}</div>`;
  const content = document.getElementById('changelogContent');
  content.innerHTML = changelogData.entries.map(e => `
      <div class="changelog-entry">
        <div class="date">${escapeHtml(e.date)}</div>
        <div class="notes">${escapeHtml(e.notes)}</div>
      </div>
    `).join('');
}

/* ---------- 通用資料工具：容忍每筆案例欄位形狀不同（字串 / 陣列 / 成對物件） ---------- */

function isEmpty(v) {
  if (v == null) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === 'string') return v.trim() === '';
  return false;
}

function itemLabel(item) {
  return typeof item === 'string' ? item : (item.name || '');
}

function renderListItems(items) {
  return `<ol>${items.map(i => {
    if (typeof i === 'string') return `<li>${escapeHtml(i)}</li>`;
    return `<li><strong>${escapeHtml(i.name || '')}</strong>${i.desc ? ui().colon + escapeHtml(i.desc) : ''}</li>`;
  }).join('')}</ol>`;
}

function renderContent(val) {
  if (isEmpty(val)) return null;
  if (typeof val === 'string') return `<div class="text">${escapeHtml(val)}</div>`;
  if (Array.isArray(val)) return renderListItems(val);
  return null;
}

function field(key, val) {
  const html = renderContent(val);
  if (!html) return '';
  return `<section class="field"><h2 class="field-title">${escapeHtml(flabel(key))}</h2>${html}</section>`;
}

function chipsField(key, items) {
  if (isEmpty(items)) return '';
  return `<section class="field"><h2 class="field-title">${escapeHtml(flabel(key))}</h2><div class="chips">${items.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div></section>`;
}

/* ---------- 分類篩選 + 搜尋 ---------- */

function allCategories() {
  const s = new Set();
  cases.forEach(c => (loc(c).category || []).forEach(t => s.add(t)));
  return [...s];
}

function renderCategoryFilters() {
  const el = document.getElementById('categoryFilters');
  el.innerHTML = `<span class="filter-label">${escapeHtml(ui().filterLabel)}</span>`;

  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn';
  allBtn.type = 'button';
  allBtn.textContent = ui().all;
  allBtn.setAttribute('aria-pressed', activeCategory === null);
  allBtn.onclick = () => {
    activeCategory = null;
    currentPage = 1;
    renderCategoryFilters();
    render();
  };
  if (activeCategory === null) allBtn.classList.add('active');
  el.appendChild(allBtn);

  allCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.type = 'button';
    btn.textContent = cat;
    btn.setAttribute('aria-pressed', activeCategory === cat);
    btn.onclick = () => {
      activeCategory = activeCategory === cat ? null : cat;
      currentPage = 1;
      renderCategoryFilters();
      render();
    };
    if (activeCategory === cat) btn.classList.add('active');
    el.appendChild(btn);
  });
}

function matches(c, q) {
  const lc = loc(c);
  if (activeCategory && !(lc.category || []).includes(activeCategory)) return false;
  if (!q) return true;
  const toolNames = (lc.tools || []).map(itemLabel);
  const haystack = [
    lc.title, lc.summary, lc.problem_background, lc.core_problem, lc.solution,
    lc.author, lc.unit_request, lc.unit_owner,
    ...(lc.category || []), ...toolNames, ...(lc.keywords || [])
  ].join(' ').toLowerCase();
  return haystack.includes(q.toLowerCase());
}

function sortedByNewest(list) {
  return list
    .map((c, idx) => ({ c, idx }))
    .sort((a, b) => {
      const cmp = (b.c.updated || '').localeCompare(a.c.updated || '');
      if (cmp !== 0) return cmp;
      return b.idx - a.idx;
    })
    .map(x => x.c);
}

const PAGE_SIZE = 12;
let currentPage = 1;

function render() {
  const q = document.getElementById('search').value.trim();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filtered = sortedByNewest(cases.filter(c => matches(c, q)));
  grid.innerHTML = '';
  empty.style.display = filtered.length ? 'none' : 'block';

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  pageItems.forEach(c => grid.appendChild(renderCard(c)));

  updateCount(filtered.length);
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  el.innerHTML = '';
  if (totalPages <= 1) return;

  const s = ui();
  const goTo = (p) => {
    currentPage = p;
    render();
    const grid = document.getElementById('grid');
    grid.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
    const firstLink = grid.querySelector('.card-link');
    if (firstLink) firstLink.focus({ preventScroll: true });
  };

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.textContent = s.prevPage;
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => goTo(currentPage - 1);
  el.appendChild(prevBtn);

  const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
  let lastPage = 0;
  [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b).forEach(p => {
    if (lastPage && p - lastPage > 1) {
      const dots = document.createElement('span');
      dots.className = 'ellipsis';
      dots.textContent = '…';
      el.appendChild(dots);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = p;
    btn.setAttribute('aria-label', s.pageLabel(p));
    if (p === currentPage) {
      btn.className = 'active';
      btn.setAttribute('aria-current', 'page');
    }
    btn.onclick = () => goTo(p);
    el.appendChild(btn);
    lastPage = p;
  });

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.textContent = s.nextPage;
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => goTo(currentPage + 1);
  el.appendChild(nextBtn);
}

function renderCard(c) {
  const lc = loc(c);
  const s = ui();
  const card = document.createElement('div');
  card.className = 'card';

  const browserBar = document.createElement('div');
  browserBar.className = 'browser-bar';
  browserBar.innerHTML = `
    <div class="traffic-lights"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    ${c.number ? `<div class="case-number">No.${c.number}</div>` : ''}
    <div class="url-pill">${escapeHtml(domainFromUrl(c.url))}</div>
  `;

  const thumbSrc = c.screenshot || (Array.isArray(c.screenshots) ? c.screenshots[0] : null);
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (thumbSrc) {
    thumb.innerHTML = thumbImg(thumbSrc, '', 'lazy');
  } else {
    thumb.innerHTML = `<span class="placeholder">${escapeHtml(s.noScreenshot)}</span>`;
  }

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = `
    <h3><a class="card-link" href="#case/${encodeURIComponent(c.id)}">${escapeHtml(lc.title)}</a></h3>
    <div class="chips">${(lc.category || []).map(t => `<span class="type-badge">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="summary">${escapeHtml(lc.summary || '')}</div>
    <div class="meta">
      <div>${escapeHtml(s.authorLabel)}${s.colon}${escapeHtml(lc.author || s.notProvided)}</div>
      ${lc.unit_owner ? `<div>${escapeHtml(s.ownerLabel)}${s.colon}${escapeHtml(lc.unit_owner)}</div>` : ''}
      ${c.updated ? `<div>${escapeHtml(flabel('updated'))}${s.colon}${escapeHtml(c.updated)}</div>` : ''}
    </div>
  `;

  card.appendChild(browserBar);
  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

/* ---------- 詳情頁（全頁切換，非覆蓋層） ---------- */

function youtubeEmbedUrl(url) {
  if (!url) return null;
  let m = url.match(/^https?:\/\/(?:www\.)?youtu\.be\/([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/embed\/([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/shorts\/([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function renderDetail(c) {
  const lc = loc(c);
  const s = ui();
  const content = document.getElementById('detailContent');

  const metaItems = [
    [flabel('category'), (lc.category || []).join(s.listSep)],
    [flabel('unit_request'), lc.unit_request],
    [flabel('unit_owner'), lc.unit_owner],
    [flabel('author'), lc.author],
    [flabel('status'), lc.status],
    [flabel('region'), lc.region],
    [flabel('updated'), c.updated],
  ].filter(([, v]) => !isEmpty(v));

  const videoList = Array.isArray(c.video) ? c.video : (c.video ? [c.video] : []);
  const videoEmbeds = videoList.map(youtubeEmbedUrl).filter(Boolean);
  const galleryImages = Array.isArray(c.screenshots) ? c.screenshots.filter(Boolean) : [];
  const url = safeUrl(c.url);

  // 成效放最前面；其餘依「背景 → 做法 → 延伸」分組
  const highlights = field('results', lc.results) + field('value', lc.value);
  const groups = [
    (url ? `<section class="field"><h2 class="field-title">${escapeHtml(flabel('url'))}</h2><div class="text"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></div></section>` : '')
      + field('problem_background', lc.problem_background)
      + field('core_problem', lc.core_problem),
    field('solution', lc.solution)
      + field('process', lc.process)
      + field('features', lc.features)
      + field('ai_usage', lc.ai_usage)
      + field('tools', lc.tools),
    chipsField('extensions', lc.extensions)
      + field('limitations', lc.limitations)
      + field('success_key', lc.success_key)
      + chipsField('keywords', lc.keywords),

  const title = escapeHtml(lc.title);
  content.innerHTML = `
    ${videoEmbeds.map(src => `<div class="video-embed"><iframe src="${src}" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`).join('')}
    ${(galleryImages.length && !videoEmbeds.length) ? `
      <div class="gallery">
        <button type="button" class="gallery-main" id="galleryMain" aria-label="${escapeHtml(s.openImage)}"><img id="galleryMainImg" src="${escapeHtml(galleryImages[0])}" alt="${title}" /></button>
        ${galleryImages.length > 1 ? `<div class="gallery-thumbs">${galleryImages.map((src, i) => `<button type="button" class="gallery-thumb${i === 0 ? ' active' : ''}" data-idx="${i}" aria-label="${escapeHtml(s.imageN(i + 1, galleryImages.length))}" aria-pressed="${i === 0}">${thumbImg(src, '', 'lazy')}</button>`).join('')}</div>` : ''}
      </div>
    ` : ((c.screenshot && !videoEmbeds.length) ? `<div class="hero"><img src="${escapeHtml(c.screenshot)}" alt="${title}" /></div>` : '')}
    ${c.number ? `<div class="case-number">No.${escapeHtml(c.number)}</div>` : ''}
    <h1 class="detail-title" id="detailTitle" tabindex="-1">${title}</h1>
    ${lc.summary ? `<p class="subtitle">${escapeHtml(lc.summary)}</p>` : ''}

    ${metaItems.length ? `<dl class="meta-grid">${metaItems.map(([label, v]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(v)}</dd></div>`).join('')}</dl>` : ''}

    ${highlights ? `<div class="highlights" role="region" aria-label="${escapeHtml(s.highlightsLabel)}">${highlights}</div>` : ''}
    ${groups.map(g => `<div class="field-group">${g}</div>`).join('')}
  `;

  setupGallery(galleryImages, lc.title);
}

/* ---------- 圖片相簿 / 燈箱 ---------- */

let lightboxImages = [];
let lightboxIndex = 0;
let lightboxTitle = '';
let lightboxReturnFocus = null;

function setupGallery(images, title) {
  if (!images.length) return;
  const mainImg = document.getElementById('galleryMainImg');
  // 有影片的案例不顯示相簿（見 renderDetail），頁面上沒有相簿元素就不用綁事件
  if (!mainImg) return;
  const thumbs = document.querySelectorAll('.gallery-thumb');
  thumbs.forEach(thumb => {
    thumb.addEventListener('click', () => {
      const idx = Number(thumb.dataset.idx);
      mainImg.src = images[idx];
      thumbs.forEach(t => {
        const on = t === thumb;
        t.classList.toggle('active', on);
        t.setAttribute('aria-pressed', on);
      });
    });
  });
  document.getElementById('galleryMain').addEventListener('click', () => {
    const activeThumb = document.querySelector('.gallery-thumb.active');
    openLightbox(images, activeThumb ? Number(activeThumb.dataset.idx) : 0, title);
  });
}

function openLightbox(images, index, title) {
  lightboxImages = images;
  lightboxIndex = index;
  lightboxTitle = title || '';
  lightboxReturnFocus = document.activeElement;
  renderLightbox();
  document.getElementById('lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('lightboxClose').focus();
}

function closeLightbox() {
  document.getElementById('lightbox').hidden = true;
  document.body.style.overflow = '';
  if (lightboxReturnFocus && document.contains(lightboxReturnFocus)) lightboxReturnFocus.focus();
  lightboxReturnFocus = null;
}

function lightboxNav(delta) {
  lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
}

function renderLightbox() {
  const n = lightboxImages.length;
  const img = document.getElementById('lightboxImg');
  img.src = lightboxImages[lightboxIndex];
  img.alt = n > 1 ? `${lightboxTitle}（${ui().imageN(lightboxIndex + 1, n)}）` : lightboxTitle;
  const counter = document.getElementById('lightboxCounter');
  counter.textContent = n > 1 ? `${lightboxIndex + 1} / ${n}` : '';
  counter.hidden = n <= 1;
  document.getElementById('lightboxPrev').hidden = n <= 1;
  document.getElementById('lightboxNext').hidden = n <= 1;
}

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => lightboxNav(-1));
document.getElementById('lightboxNext').addEventListener('click', () => lightboxNav(1));
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
window.addEventListener('keydown', (e) => {
  const lightbox = document.getElementById('lightbox');
  if (lightbox.hidden) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lightboxNav(-1);
  else if (e.key === 'ArrowRight') lightboxNav(1);
  else if (e.key === 'Tab') {
    // 焦點鎖在燈箱內
    const focusables = [...lightbox.querySelectorAll('button')].filter(b => !b.hidden);
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!lightbox.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});

let listScrollY = 0;
let lastCaseId = null;
let listScrollToTop = false;

function currentView() {
  if (!document.getElementById('detailView').hidden) return 'detail';
  if (!document.getElementById('leaderboardView').hidden) return 'leaderboard';
  return 'list';
}

function rememberListScroll() {
  if (currentView() === 'list') listScrollY = window.scrollY;
}

function showList() {
  const from = currentView();
  document.getElementById('listView').hidden = false;
  document.getElementById('detailView').hidden = true;
  document.getElementById('leaderboardView').hidden = true;
  if (listScrollToTop || from === 'list') {
    window.scrollTo(0, 0);
    listScrollToTop = false;
    return;
  }
  // 從案例返回：回到原本的捲動位置，焦點放回剛才那張卡片
  window.scrollTo(0, listScrollY);
  const link = lastCaseId && document.querySelector(`.card-link[href="#case/${CSS.escape(encodeURIComponent(lastCaseId))}"]`);
  if (link) link.focus({ preventScroll: true });
}

function showDetail(id) {
  const c = cases.find(x => x.id === id);
  if (!c) { showList(); return; }
  rememberListScroll();
  lastCaseId = id;
  renderDetail(c);
  document.getElementById('listView').hidden = true;
  document.getElementById('detailView').hidden = false;
  document.getElementById('leaderboardView').hidden = true;
  window.scrollTo(0, 0);
  document.getElementById('detailTitle').focus({ preventScroll: true });
}

function showLeaderboard() {
  rememberListScroll();
  renderLeaderboard();
  document.getElementById('listView').hidden = true;
  document.getElementById('detailView').hidden = true;
  document.getElementById('leaderboardView').hidden = false;
  window.scrollTo(0, 0);
}

function routeFromHash() {
  if (!document.getElementById('lightbox').hidden) closeLightbox();
  const m = location.hash.match(/^#case\/(.+)$/);
  if (m) { showDetail(decodeURIComponent(m[1])); return; }
  if (location.hash === '#leaderboard') { showLeaderboard(); return; }
  showList();
}

/* ---------- 排行榜：依負責單位統計案例數 ---------- */

function computeLeaderboard() {
  const counts = new Map();
  cases.forEach(c => {
    const unit = (loc(c).unit_owner || '').trim() || ui().notProvided;
    counts.set(unit, (counts.get(unit) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function renderLeaderboard() {
  const s = ui();
  document.getElementById('leaderboardTitle').textContent = s.leaderboardTitle;
  document.getElementById('leaderboardSubtitle').textContent = s.leaderboardSubtitle;

  const ranking = computeLeaderboard();
  const rankClass = (i) => (i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '');

  const list = document.getElementById('leaderboardList');
  list.innerHTML = ranking.map(([unit, count], i) => `
    <button type="button" class="lb-row" data-unit="${escapeHtml(unit)}">
      <span class="lb-rank ${rankClass(i)}">${i + 1}</span>
      <span class="lb-name">${escapeHtml(unit)}</span>
      <span class="lb-count">${escapeHtml(s.caseCountLabel(count))}</span>
    </button>
  `).join('');

  list.querySelectorAll('.lb-row').forEach(row => {
    row.addEventListener('click', () => goToUnit(row.dataset.unit));
  });
}

function goToUnit(unit) {
  activeCategory = null;
  currentPage = 1;
  document.getElementById('search').value = unit === ui().notProvided ? '' : unit;
  syncSearchClear();
  renderCategoryFilters();
  render();
  listScrollToTop = true;
  location.hash = '';
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function safeUrl(url) {
  return /^https?:\/\//i.test(url || '') ? url : '';
}

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* 列表與小縮圖優先載入 assets/thumbs/ 的 WebP 縮圖（scripts/make_thumbs.py 產生），找不到就退回原圖 */
function thumbFor(src) {
  const m = /^assets\/(?:.*\/)?([^/]+)\.(?:png|jpe?g|webp)$/i.exec(src || '');
  return m ? `assets/thumbs/${m[1]}.webp` : src;
}

function thumbImg(src, alt, loading) {
  const small = thumbFor(src);
  const fallback = small !== src ? ` onerror="this.onerror=null;this.src='${escapeHtml(src)}'"` : '';
  return `<img src="${escapeHtml(small)}" alt="${escapeHtml(alt)}" loading="${loading}" decoding="async"${fallback} />`;
}

function syncSearchClear() {
  document.getElementById('searchClear').hidden = !document.getElementById('search').value;
}

document.getElementById('search').addEventListener('input', () => { syncSearchClear(); currentPage = 1; render(); });
document.getElementById('searchClear').addEventListener('click', () => {
  const search = document.getElementById('search');
  search.value = '';
  syncSearchClear();
  currentPage = 1;
  render();
  search.focus();
});
document.getElementById('pageTitle').addEventListener('click', (e) => {
  e.preventDefault();
  activeCategory = null;
  currentPage = 1;
  document.getElementById('search').value = '';
  syncSearchClear();
  renderCategoryFilters();
  render();
  if (location.hash) {
    listScrollToTop = true;
    history.pushState(null, '', location.pathname + location.search);
    routeFromHash();
  } else {
    window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }
});
document.getElementById('backBtn').addEventListener('click', () => { location.hash = ''; });
document.getElementById('leaderboardBackBtn').addEventListener('click', () => { location.hash = ''; });
document.getElementById('leaderboardBtn').addEventListener('click', () => { location.hash = 'leaderboard'; });
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});
window.addEventListener('hashchange', routeFromHash);

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

document.addEventListener('click', (e) => {
  const details = document.getElementById('changelogDetails');
  if (details.open && !details.contains(e.target)) {
    details.open = false;
  }
});
document.addEventListener('keydown', (e) => {
  const details = document.getElementById('changelogDetails');
  if (e.key === 'Escape' && details.open) {
    details.open = false;
    document.getElementById('versionBadge').focus();
  }
});

let gateBubbleState = 'Hello';
let gateErrorKey = '';

function gateText() { return GATE_TEXT[currentLang] || GATE_TEXT.zh; }

function gateSetBubble(state) {
  gateBubbleState = state;
  const bubble = document.getElementById('gateBubble');
  bubble.textContent = gateText()['bubble' + state];
  bubble.className = 'gate-bubble' + (state === 'Wrong' || state === 'Empty' ? ' warn' : state === 'Ok' ? ' ok' : '');
  // 重新觸發彈出動畫
  bubble.style.animation = 'none';
  void bubble.offsetWidth;
  bubble.style.animation = '';
}

function gateSetError(key) {
  gateErrorKey = key;
  document.getElementById('gateError').textContent = key ? gateText()[key] : '';
  document.getElementById('gateField').classList.toggle('invalid', !!key);
}

function gateRenderText() {
  const t = gateText();
  document.getElementById('gateCorp').textContent = t.corp;
  document.getElementById('gateTitle').innerHTML = t.title;
  document.getElementById('gateDesc').textContent = t.desc;
  document.querySelectorAll('.gate-chip').forEach((el, i) => { el.textContent = t.chips[i] || ''; });
  document.getElementById('gateBadge').textContent = t.badge;
  document.getElementById('gateHeading').textContent = t.heading;
  document.getElementById('gateHint').textContent = t.hint;
  document.getElementById('gateLabel').textContent = t.label;
  document.getElementById('gatePassword').placeholder = t.placeholder;
  document.getElementById('gateSubmitText').textContent = t.submit;
  document.getElementById('gateFootNote').textContent = t.footNote;
  const eye = document.getElementById('gateEye');
  eye.setAttribute('aria-label', eye.getAttribute('aria-pressed') === 'true' ? t.hide : t.show);
  document.querySelectorAll('[data-gate-lang]').forEach(btn => {
    const on = btn.dataset.gateLang === currentLang;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-Hant';
  document.getElementById('gateBubble').textContent = t['bubble' + gateBubbleState];
  if (gateErrorKey) document.getElementById('gateError').textContent = t[gateErrorKey];
}

async function gateDigest(password) {
  const bytes = new TextEncoder().encode(GATE_SALT + password);
  const buf = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function gateRestartAnimation(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function gateConfetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#0d5bd7', '#52a94f', '#ffc93c', '#ff8a3d', '#ff7aa8', '#7c5cff'];
  const box = document.createElement('div');
  box.className = 'gate-confetti';
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i');
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 240 - 120) + 'px');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.setProperty('--d', (1.1 + Math.random() * 0.9) + 's');
    p.style.setProperty('--delay', (Math.random() * 0.25) + 's');
    if (i % 3 === 0) p.style.borderRadius = '50%';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2400);
}

function gateUnlock() {
  try { localStorage.setItem(GATE_KEY, GATE_HASH); } catch (e) { /* 存不了就只開放這一次 */ }
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gate = document.getElementById('gate');
  gateSetBubble('Ok');
  gateRestartAnimation(document.getElementById('gateMascot'), 'cheer');
  gateConfetti();
  setTimeout(() => gate.classList.add('gate-leaving'), reduced ? 0 : 900);
  setTimeout(() => {
    document.documentElement.classList.remove('gate-locked');
    gate.remove();
    window.scrollTo(0, 0);
    load();
  }, reduced ? 50 : 1450);
}

function setupGate() {
  document.getElementById('gateYear').textContent = new Date().getFullYear();
  gateRenderText();

  const input = document.getElementById('gatePassword');
  const eye = document.getElementById('gateEye');
  const submit = document.getElementById('gateSubmit');

  document.querySelectorAll('[data-gate-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.gateLang;
      try { localStorage.setItem('caseLibLang', currentLang); } catch (e) {}
      gateRenderText();
    });
  });

  eye.addEventListener('click', () => {
    const show = eye.getAttribute('aria-pressed') !== 'true';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? gateText().hide : gateText().show);
    input.type = show ? 'text' : 'password';
    input.focus();
  });

  input.addEventListener('input', () => {
    if (gateErrorKey) gateSetError('');
    if (gateBubbleState !== 'Hello') gateSetBubble('Hello');
  });

  document.getElementById('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submit.disabled) return;
    const password = input.value.trim();
    const fail = (errKey, bubble) => {
      gateSetError(errKey);
      gateSetBubble(bubble);
      gateRestartAnimation(document.getElementById('gateCard'), 'shake');
      gateRestartAnimation(document.getElementById('gateMascot'), 'nope');
      input.focus();
      input.select();
    };
    if (!password) { fail('errEmpty', 'Empty'); return; }
    if (!(window.crypto && crypto.subtle)) { fail('errUnsupported', 'Wrong'); return; }

    submit.disabled = true;
    document.getElementById('gateSubmitText').textContent = gateText().checking;
    let ok = false;
    try { ok = (await gateDigest(password)) === GATE_HASH; } catch (err) { console.error(err); }
    if (ok) {
      gateSetError('');
      gateUnlock();
    } else {
      submit.disabled = false;
      document.getElementById('gateSubmitText').textContent = gateText().submit;
      fail('errWrong', 'Wrong');
    }
  });

  input.focus();
}

if (document.documentElement.classList.contains('gate-locked')) {
  setupGate();
} else {
  const gate = document.getElementById('gate');
  if (gate) gate.remove();
  load();
}
