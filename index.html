<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宏全AI應用推動案例庫</title>
<meta name="description" content="分享用 AI 或自動化工具解決廠內流程問題的實際案例，可搜尋、依案例分類篩選。" />
<meta property="og:title" content="宏全AI應用推動案例庫" />
<meta property="og:description" content="分享用 AI 或自動化工具解決廠內流程問題的實際案例，可搜尋、依案例分類篩選。" />
<meta property="og:type" content="website" />
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-muted: #5b6270;
    --border: #dfe3e8;
    --border-strong: #878e9b;
    --accent: #2563eb;
    --accent-soft: #eef2ff;
    --chip-bg: #eef2ff;
    --chip-text: #2c3e8f;
    --image-bg: #eceef2;
    --titlebar-bg: #e7e9ee;
    --selection: #c9d7fb;

    /* 字級：只用這 6 階 */
    --fs-xs: 13px;
    --fs-sm: 14px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
    --fs-xl: 30px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: var(--fs-base);
    accent-color: var(--accent);
  }
  ::selection { background: var(--selection); color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font-family: inherit; }
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: relative;
    padding: 44px 24px 26px;
    text-align: center;
  }
  .header-topright {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 6;
  }
  .lang-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .lang-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text-muted);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 7px 13px;
    cursor: pointer;
  }
  .lang-btn:focus-visible { outline-offset: -3px; }
  .lang-btn + .lang-btn { border-left: 1.5px solid var(--border); }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .leaderboard-btn {
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--text);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .leaderboard-btn:hover { border-color: var(--accent); color: var(--accent); }
  .version-toggle { position: relative; margin: 0; }
  .version-toggle summary {
    list-style: none;
    display: inline-flex;
    align-items: center;
    background: var(--chip-bg);
    color: var(--chip-text);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .version-toggle summary::-webkit-details-marker { display: none; }
  .changelog-box {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 300px;
    max-width: calc(100vw - 32px);
    text-align: left;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 3px 8px rgba(26, 29, 35, 0.08);
  }
  .changelog-header { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .changelog-list { max-height: 300px; overflow-y: auto; }
  .changelog-entry { margin-bottom: 14px; }
  .changelog-entry:last-child { margin-bottom: 0; }
  .changelog-entry .date { font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
  .changelog-entry .notes { font-size: var(--fs-sm); line-height: 1.6; }
  header h1 { margin: 0 0 10px; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.01em; }
  #pageTitle { color: inherit; text-decoration: none; border-radius: 6px; }
  header p { margin: 0 0 14px; color: var(--text-muted); font-size: var(--fs-base); }
  #totalCount {
    display: inline-block;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: var(--fs-sm);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 6px 16px;
    border-radius: 999px;
  }

  /* ---------- controls ---------- */
  .controls {
    max-width: 980px;
    margin: 0 auto 30px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #search {
    width: 100%;
    padding: 14px 18px;
    font-size: var(--fs-base);
    font-family: inherit;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--text);
  }
  #search::placeholder { color: var(--text-muted); }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-wrap { position: relative; }
  .search-wrap #search { padding-right: 52px; }
  #searchClear {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #searchClear:hover { background: var(--border); color: var(--text); }
  #searchClear[hidden] { display: none; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
  .filter-row .filter-label { font-size: var(--fs-sm); color: var(--text-muted); margin-right: 2px; font-weight: 600; }
  .tag-btn {
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: var(--fs-sm);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tag-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- grid / cards ---------- */
  main { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .card:hover { border-color: var(--accent); }
  .card:has(.card-link:focus-visible) { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-link { color: inherit; text-decoration: none; }
  .card-link:focus-visible { outline: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .card .browser-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--titlebar-bg);
    border-bottom: 1.5px solid var(--border);
  }
  .card .traffic-lights { display: flex; gap: 6px; flex-shrink: 0; }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; }
  .card .dot.red { background: #ff5f57; }
  .card .dot.yellow { background: #febc2e; }
  .card .dot.green { background: #28c840; }
  .card .url-pill {
    flex: 1;
    background: var(--card-bg);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: var(--fs-xs);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .case-number {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .card .thumb {
    width: 100%;
    height: 180px;
    background: var(--image-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card .thumb .placeholder { color: var(--text-muted); font-size: var(--fs-sm); }
  .card .body { padding: 18px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .card .type-badge {
    display: inline-block;
    align-self: flex-start;
    background: var(--chip-bg);
    color: var(--chip-text);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .card h3 { margin: 0; font-size: var(--fs-md); font-weight: 700; line-height: 1.35; }
  .card .summary {
    font-size: var(--fs-sm);
    color: var(--text-muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta { font-size: var(--fs-xs); color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: var(--chip-bg); color: var(--chip-text); font-size: var(--fs-xs); font-weight: 600; padding: 4px 11px; border-radius: 999px; }
  #empty { text-align: center; color: var(--text-muted); font-size: var(--fs-base); padding: 60px 0; display: none; }

  /* 載入中的骨架卡片 */
  .card.skeleton { cursor: default; }
  .card.skeleton:hover { border-color: var(--border); }
  .sk-line { display: block; height: 14px; border-radius: 6px; background: var(--image-bg); }
  .sk-line.title { height: 20px; width: 75%; }
  .sk-line.short { width: 45%; }
  .card.skeleton .thumb, .card.skeleton .sk-line { animation: sk-pulse 1.4s ease-in-out infinite; }
  @keyframes sk-pulse { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) {
    .card.skeleton .thumb, .card.skeleton .sk-line { animation: none; }
  }
  .load-error {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text);
    font-size: var(--fs-base);
    line-height: 1.7;
    padding: 48px 16px;
  }
  .load-error button {
    margin-top: 14px;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: var(--fs-sm);
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
  }

  /* ---------- pagination ---------- */
  .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 32px; }
  .pagination button {
    min-width: 40px;
    height: 40px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: var(--fs-sm);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); }
  .pagination button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination .ellipsis { color: var(--text-muted); padding: 0 4px; }

  /* ---------- detail view (full page, no overlay) ---------- */
  #detailView { max-width: 760px; margin: 0 auto; padding: 0 20px 64px; }
  .detail-topbar { position: sticky; top: 0; background: var(--bg); padding: 16px 0; z-index: 5; }
  #backBtn, #leaderboardBackBtn {
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: var(--fs-base);
    font-weight: 600;
    cursor: pointer;
  }
  #backBtn:hover, #leaderboardBackBtn:hover { border-color: var(--accent); color: var(--accent); }

  .hero {
    width: 100%;
    max-height: 60vh;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .hero img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }

  .gallery { margin-bottom: 20px; }
  .gallery-main {
    width: 100%;
    max-height: 60vh;
    padding: 0;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: zoom-in;
  }
  .gallery-main img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .gallery-thumbs {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .gallery-thumb {
    width: 72px;
    height: 54px;
    padding: 0;
    background: var(--image-bg);
    border-radius: 8px;
    border: 2px solid transparent;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0.7;
  }
  .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-thumb:hover, .gallery-thumb:focus-visible { opacity: 1; }
  .gallery-thumb.active { border-color: var(--accent); opacity: 1; }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .lightbox[hidden] { display: none; }
  .lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; }
  .lightbox-close, .lightbox-nav {
    position: absolute;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255, 255, 255, 0.25); }
  .lightbox :focus-visible { outline-color: #fff; }
  .lightbox-close { top: 18px; right: 18px; width: 44px; height: 44px; }
  .lightbox-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 30px; }
  .lightbox-prev { left: 18px; }
  .lightbox-next { right: 18px; }
  .lightbox-counter {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.12);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .video-embed {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--image-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .detail-title { margin: 0 0 10px; font-size: var(--fs-xl); line-height: 1.35; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .detail-title:focus { outline: none; }
  #detailContent .subtitle { color: var(--text-muted); font-size: var(--fs-md); line-height: 1.65; margin: 0 0 24px; }

  .leaderboard-wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  .leaderboard-wrap h1 { margin: 0 0 8px; font-size: var(--fs-xl); line-height: 1.35; font-weight: 800; text-align: center; }
  .leaderboard-wrap .subtitle { color: var(--text-muted); font-size: var(--fs-md); line-height: 1.65; margin: 0 0 28px; text-align: center; }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    color: var(--text);
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .lb-row:hover { border-color: var(--accent); }
  .lb-rank {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: var(--fs-base);
    font-variant-numeric: tabular-nums;
    background: var(--chip-bg);
    color: var(--chip-text);
  }
  .lb-rank.gold { background: #fde68a; color: #92400e; }
  .lb-rank.silver { background: #e5e7eb; color: #374151; }
  .lb-rank.bronze { background: #fbd38d; color: #7c2d12; }
  .lb-name {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    font-size: var(--fs-base);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-count {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: var(--fs-xs);
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }
  #detailContent .case-number {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: var(--fs-xs);
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 0 0 28px;
  }
  .meta-grid dt { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 700; margin-bottom: 3px; }
  .meta-grid dd { margin: 0; font-size: var(--fs-sm); line-height: 1.55; }

  /* 成效摘要：執行成果＋產生價值，放在最前面 */
  .highlights {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 22px 24px 4px;
    margin-bottom: 32px;
  }
  .highlights .field { margin-bottom: 18px; }

  .field-group + .field-group { border-top: 1px solid var(--border); padding-top: 30px; }
  .field-group { margin-bottom: 8px; }
  .field { margin-bottom: 28px; }
  .field-title {
    margin: 0 0 10px;
    font-size: var(--fs-md);
    font-weight: 800;
    line-height: 1.4;
    color: var(--text);
  }
  .field .text { font-size: var(--fs-base); line-height: 1.8; white-space: pre-line; }
  .field ol { margin: 0; padding-left: 22px; font-size: var(--fs-base); line-height: 1.8; }
  .field ol li { margin-bottom: 6px; }
  .field a { color: var(--accent); word-break: break-all; font-size: var(--fs-base); text-underline-offset: 3px; }

  @media (max-width: 600px) {
    header { padding: 64px 16px 22px; }
    header h1 { font-size: var(--fs-lg); }
    .controls, main, #detailView { padding-left: 16px; padding-right: 16px; }
    #grid { grid-template-columns: 1fr; gap: 16px; }
    .card .thumb { height: 200px; }
    .detail-title, .leaderboard-wrap h1 { font-size: var(--fs-lg); }
    .meta-grid { grid-template-columns: repeat(2, 1fr); }
    .hero, .hero img { max-height: 45vh; }
    .highlights { padding: 18px 18px 2px; }
  }

  /* 觸控裝置：可點目標至少 44px */
  @media (pointer: coarse) {
    .lang-btn, .leaderboard-btn, .tag-btn, .version-toggle summary,
    #backBtn, #leaderboardBackBtn { min-height: 44px; }
    .pagination button { min-width: 44px; height: 44px; }
    #searchClear { width: 44px; height: 44px; right: 4px; }
  }
  @media (pointer: coarse) and (max-width: 600px) {
    header { padding-top: 76px; }
  }
</style>
</head>
<body>

<section id="listView">
  <header>
    <div class="header-topright">
      <button id="leaderboardBtn" class="leaderboard-btn" type="button"></button>
      <div class="lang-toggle" role="group" aria-label="語言 Language">
        <button class="lang-btn" type="button" data-lang="zh" lang="zh-Hant">中文</button>
        <button class="lang-btn" type="button" data-lang="en" lang="en">EN</button>
      </div>
      <details class="version-toggle" id="changelogDetails">
        <summary id="versionBadge">v1.0.0</summary>
        <div class="changelog-box">
          <div class="changelog-header" id="changelogHeader"></div>
          <div class="changelog-list" id="changelogContent"></div>

    </div>
    <h1><a id="pageTitle" href="#">宏全AI應用推動案例庫</a></h1>

  </header>

  <div class="controls">
    <div class="search-wrap" role="search">
      <label for="search" id="searchLabel" class="visually-hidden">搜尋案例</label>

      <button id="searchClear" type="button" aria-label="清除搜尋" title="清除搜尋" hidden>&times;</button>

<section id="detailView" hidden>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="圖片檢視" hidden>

  <img class="lightbox-img" id="lightboxImg" alt="" />
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="下一張">›</button>
  <div class="lightbox-counter" id="lightboxCounter" aria-live="polite"></div>

<script>
let cases = [];
let changelogData = null;
let activeCategory = null;
let currentLang = localStorage.getItem('caseLibLang') || 'zh';

const UI_STRINGS = {
  zh: {
    pageTitle: '宏全AI應用推動案例庫',

    clearSearch: '清除搜尋',
    filterLabel: '分類',
    all: '全部',
    empty: '找不到符合的案例',
    totalCount: (n) => `共收錄 ${n} 個案例`,
    authorLabel: '製作人',
    ownerLabel: '負責單位',
    noScreenshot: '尚無畫面',
    noUrl: '尚無網站連結',
    backBtn: '← 返回案例庫',

    listSep: '、',
    colon: '：',
    divider: ' ｜ ',
    leaderboardBtn: '🏆 排行榜',

    leaderboardSubtitle: '依「負責單位」的案例數量排序',
    caseCountLabel: (n) => `${n} 個案例`,
    prevPage: '上一頁',
    nextPage: '下一頁',
    shownCount: (f, n) => `顯示 ${f} / ${n} 個案例`,
    searchLabel: '搜尋案例',
    filterGroup: '依分類篩選',
    listHeading: '案例列表',
    paginationLabel: '分頁',
    pageLabel: (p) => `第 ${p} 頁`,
    langGroup: '語言',
    loadError: '案例資料載入失敗，請確認網路連線後再試一次。',
    retry: '重新載入',
    openImage: '放大檢視圖片',
    imageN: (i, n) => `第 ${i} 張圖，共 ${n} 張`,
    lightboxLabel: '圖片檢視',
    close: '關閉',
    prevImage: '上一張',
    nextImage: '下一張',
    highlightsLabel: '成效摘要'
  },
  en: {

    clearSearch: 'Clear search',
    filterLabel: 'Category',
    all: 'All',
    empty: 'No matching cases found',
    totalCount: (n) => `${n} cases collected`,
    authorLabel: 'Author',
    ownerLabel: 'Owning Unit',
    noScreenshot: 'No screenshot yet',
    noUrl: 'No website link yet',
    backBtn: '← Back to Case Library',
    currentVersion: 'Current Version',
    notProvided: 'Not provided',
    listSep: ', ',
    colon: ': ',
    divider: ' | ',
    leaderboardBtn: '🏆 Leaderboard',
    leaderboardTitle: 'Case Contribution Leaderboard',
    leaderboardSubtitle: 'Ranked by number of cases per owning unit',
    caseCountLabel: (n) => `${n} case${n === 1 ? '' : 's'}`,
    prevPage: 'Prev',
    nextPage: 'Next',
    shownCount: (f, n) => `Showing ${f} of ${n} cases`,
    searchLabel: 'Search cases',
    filterGroup: 'Filter by category',
    listHeading: 'Case list',
    paginationLabel: 'Pagination',
    pageLabel: (p) => `Page ${p}`,
    langGroup: 'Language',
    loadError: 'Could not load the case data. Check your connection and try again.',
    retry: 'Reload',
    openImage: 'Enlarge image',
    imageN: (i, n) => `Image ${i} of ${n}`,
    lightboxLabel: 'Image viewer',
    close: 'Close',
    prevImage: 'Previous image',
    nextImage: 'Next image',
    highlightsLabel: 'Results at a glance'
  }
};

const FIELD_LABELS = {
  category: { zh: '案例分類', en: 'Category' },
  unit_request: { zh: '需求單位', en: 'Requesting Unit' },
  unit_owner: { zh: '負責單位', en: 'Owning Unit' },
  author: { zh: '案例負責人', en: 'Case Owner' },
  status: { zh: '案例狀態', en: 'Status' },
  region: { zh: '適用地區', en: 'Region' },
  url: { zh: '網站連結', en: 'Website Link' },
  video: { zh: '影片介紹', en: 'Video Walkthrough' },
  problem_background: { zh: '問題背景', en: 'Background' },
  core_problem: { zh: '核心問題', en: 'Core Problem' },
  solution: { zh: '解決方案', en: 'Solution' },
  process: { zh: '執行流程', en: 'Process' },
  features: { zh: '主要功能', en: 'Key Features' },
  ai_usage: { zh: 'AI 的應用方式', en: 'How AI Was Used' },

  results: { zh: '執行成果', en: 'Results' },
  value: { zh: '產生價值', en: 'Value Created' },
  extensions: { zh: '可複製與延伸應用', en: 'Reusable & Extended Applications' },
  limitations: { zh: '使用限制與注意事項', en: 'Limitations & Notes' },
  success_key: { zh: '成功關鍵', en: 'Key to Success' },
  keywords: { zh: '案例關鍵字', en: 'Keywords' },
  updated: { zh: '更新時間', en: 'Updated' }
};

function ui() { return UI_STRINGS[currentLang]; }
function flabel(key) { return FIELD_LABELS[key][currentLang]; }
function loc(c) { return c.i18n[currentLang] || c.i18n.zh; }

function renderSkeleton() {
  const grid = document.getElementById('grid');
  const card = `
    <div class="card skeleton" aria-hidden="true">
      <div class="browser-bar"><div class="traffic-lights"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div></div>
      <div class="thumb"></div>
      <div class="body"><span class="sk-line title"></span><span class="sk-line"></span><span class="sk-line short"></span></div>
    </div>`;
  grid.setAttribute('aria-busy', 'true');
  grid.innerHTML = card.repeat(6);
}

function renderLoadError() {
  const grid = document.getElementById('grid');
  grid.setAttribute('aria-busy', 'false');
  grid.innerHTML = `<div class="load-error" role="alert">${escapeHtml(ui().loadError)}<br><button type="button" id="retryLoad">${escapeHtml(ui().retry)}</button></div>`;
  document.getElementById('retryLoad').addEventListener('click', load);
}

async function load() {
  applyStaticText();
  renderSkeleton();
  try {
    const [casesRes, changelogRes] = await Promise.all([
      fetch('data/cases.json'),
      fetch('data/changelog.json')
    ]);
    if (!casesRes.ok) throw new Error('cases.json ' + casesRes.status);
    cases = await casesRes.json();
    changelogData = changelogRes.ok ? await changelogRes.json() : null;
  } catch (err) {
    console.error(err);
    renderLoadError();
    return;
  }
  document.getElementById('grid').setAttribute('aria-busy', 'false');
  applyStaticText();
  renderVersion();
  renderCategoryFilters();
  render();
  routeFromHash();
}

function applyStaticText() {
  const s = ui();
  document.title = s.pageTitle;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
  document.getElementById('pageTitle').textContent = s.pageTitle;
  document.getElementById('pageSubtitle').textContent = s.subtitle;
  document.getElementById('search').placeholder = s.searchPlaceholder;
  document.getElementById('searchLabel').textContent = s.searchLabel;
  document.getElementById('searchClear').setAttribute('aria-label', s.clearSearch);
  document.getElementById('searchClear').title = s.clearSearch;
  document.getElementById('categoryFilters').setAttribute('aria-label', s.filterGroup);
  document.getElementById('listHeading').textContent = s.listHeading;
  document.getElementById('pagination').setAttribute('aria-label', s.paginationLabel);
  document.querySelector('.lang-toggle').setAttribute('aria-label', s.langGroup);
  document.getElementById('empty').textContent = s.empty;
  document.getElementById('backBtn').textContent = s.backBtn;
  document.getElementById('leaderboardBackBtn').textContent = s.backBtn;
  document.getElementById('leaderboardBtn').textContent = s.leaderboardBtn;
  document.getElementById('lightbox').setAttribute('aria-label', s.lightboxLabel);
  document.getElementById('lightboxClose').setAttribute('aria-label', s.close);
  document.getElementById('lightboxPrev').setAttribute('aria-label', s.prevImage);
  document.getElementById('lightboxNext').setAttribute('aria-label', s.nextImage);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const on = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on);
  });
}

function updateCount(shown) {
  const s = ui();
  document.getElementById('totalCount').textContent =
    shown === cases.length ? s.totalCount(cases.length) : s.shownCount(shown, cases.length);
}

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  localStorage.setItem('caseLibLang', lang);
  activeCategory = null;
  currentPage = 1;
  applyStaticText();
  renderVersion();
  renderCategoryFilters();
  render();
  routeFromHash();
}

function domainFromUrl(url) {
  if (!url) return ui().noUrl;
  try {
    const u = new URL(url);
    const path = u.pathname.replace(/\/$/, '');
    return u.hostname + path;
  } catch (e) {
    return url;
  }
}

function renderVersion() {
  if (!changelogData) return;
  document.getElementById('versionBadge').textContent = changelogData.version;
  document.getElementById('changelogHeader').innerHTML =
    `<div class="date">${escapeHtml(ui().currentVersion)}</div><div class="notes">${escapeHtml(changelogData.version)}</div>`;
  const content = document.getElementById('changelogContent');
  content.innerHTML = changelogData.entries.map(e => `
      <div class="changelog-entry">
        <div class="date">${escapeHtml(e.date)}</div>
        <div class="notes">${escapeHtml(e.notes)}</div>
      </div>
    `).join('');
}

/* ---------- 通用資料工具：容忍每筆案例欄位形狀不同（字串 / 陣列 / 成對物件） ---------- */

function isEmpty(v) {
  if (v == null) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === 'string') return v.trim() === '';
  return false;
}

function itemLabel(item) {
  return typeof item === 'string' ? item : (item.name || '');
}

function renderListItems(items) {
  return `<ol>${items.map(i => {
    if (typeof i === 'string') return `<li>${escapeHtml(i)}</li>`;
    return `<li><strong>${escapeHtml(i.name || '')}</strong>${i.desc ? ui().colon + escapeHtml(i.desc) : ''}</li>`;
  }).join('')}</ol>`;
}

function renderContent(val) {
  if (isEmpty(val)) return null;
  if (typeof val === 'string') return `<div class="text">${escapeHtml(val)}</div>`;
  if (Array.isArray(val)) return renderListItems(val);
  return null;
}

function field(key, val) {
  const html = renderContent(val);
  if (!html) return '';
  return `<section class="field"><h2 class="field-title">${escapeHtml(flabel(key))}</h2>${html}</section>`;
}

function chipsField(key, items) {
  if (isEmpty(items)) return '';
  return `<section class="field"><h2 class="field-title">${escapeHtml(flabel(key))}</h2><div class="chips">${items.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div></section>`;
}

/* ---------- 分類篩選 + 搜尋 ---------- */

function allCategories() {
  const s = new Set();
  cases.forEach(c => (loc(c).category || []).forEach(t => s.add(t)));
  return [...s];
}

function renderCategoryFilters() {
  const el = document.getElementById('categoryFilters');
  el.innerHTML = `<span class="filter-label">${escapeHtml(ui().filterLabel)}</span>`;

  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn';
  allBtn.type = 'button';
  allBtn.textContent = ui().all;
  allBtn.setAttribute('aria-pressed', activeCategory === null);
  allBtn.onclick = () => {
    activeCategory = null;
    currentPage = 1;
    renderCategoryFilters();
    render();
  };
  if (activeCategory === null) allBtn.classList.add('active');
  el.appendChild(allBtn);

  allCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.type = 'button';
    btn.textContent = cat;
    btn.setAttribute('aria-pressed', activeCategory === cat);
    btn.onclick = () => {
      activeCategory = activeCategory === cat ? null : cat;
      currentPage = 1;
      renderCategoryFilters();
      render();
    };
    if (activeCategory === cat) btn.classList.add('active');
    el.appendChild(btn);
  });
}

function matches(c, q) {
  const lc = loc(c);
  if (activeCategory && !(lc.category || []).includes(activeCategory)) return false;
  if (!q) return true;
  const toolNames = (lc.tools || []).map(itemLabel);
  const haystack = [
    lc.title, lc.summary, lc.problem_background, lc.core_problem, lc.solution,
    lc.author, lc.unit_request, lc.unit_owner,
    ...(lc.category || []), ...toolNames, ...(lc.keywords || [])
  ].join(' ').toLowerCase();
  return haystack.includes(q.toLowerCase());
}

function sortedByNewest(list) {
  return list
    .map((c, idx) => ({ c, idx }))
    .sort((a, b) => {
      const cmp = (b.c.updated || '').localeCompare(a.c.updated || '');
      if (cmp !== 0) return cmp;
      return b.idx - a.idx;
    })
    .map(x => x.c);
}

const PAGE_SIZE = 12;
let currentPage = 1;

function render() {
  const q = document.getElementById('search').value.trim();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filtered = sortedByNewest(cases.filter(c => matches(c, q)));
  grid.innerHTML = '';
  empty.style.display = filtered.length ? 'none' : 'block';

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  pageItems.forEach(c => grid.appendChild(renderCard(c)));

  updateCount(filtered.length);
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  el.innerHTML = '';
  if (totalPages <= 1) return;

  const s = ui();
  const goTo = (p) => {
    currentPage = p;
    render();
    const grid = document.getElementById('grid');
    grid.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
    const firstLink = grid.querySelector('.card-link');
    if (firstLink) firstLink.focus({ preventScroll: true });
  };

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.textContent = s.prevPage;
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => goTo(currentPage - 1);
  el.appendChild(prevBtn);

  const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
  let lastPage = 0;
  [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b).forEach(p => {
    if (lastPage && p - lastPage > 1) {
      const dots = document.createElement('span');
      dots.className = 'ellipsis';
      dots.textContent = '…';
      el.appendChild(dots);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = p;
    btn.setAttribute('aria-label', s.pageLabel(p));
    if (p === currentPage) {
      btn.className = 'active';
      btn.setAttribute('aria-current', 'page');
    }
    btn.onclick = () => goTo(p);
    el.appendChild(btn);
    lastPage = p;
  });

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.textContent = s.nextPage;
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => goTo(currentPage + 1);
  el.appendChild(nextBtn);
}

function renderCard(c) {
  const lc = loc(c);
  const s = ui();
  const card = document.createElement('div');
  card.className = 'card';

  const browserBar = document.createElement('div');
  browserBar.className = 'browser-bar';
  browserBar.innerHTML = `
    <div class="traffic-lights"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    ${c.number ? `<div class="case-number">No.${c.number}</div>` : ''}
    <div class="url-pill">${escapeHtml(domainFromUrl(c.url))}</div>
  `;

  const thumbSrc = c.screenshot || (Array.isArray(c.screenshots) ? c.screenshots[0] : null);
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (thumbSrc) {
    thumb.innerHTML = thumbImg(thumbSrc, '', 'lazy');
  } else {
    thumb.innerHTML = `<span class="placeholder">${escapeHtml(s.noScreenshot)}</span>`;
  }

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = `
    <h3><a class="card-link" href="#case/${encodeURIComponent(c.id)}">${escapeHtml(lc.title)}</a></h3>
    <div class="chips">${(lc.category || []).map(t => `<span class="type-badge">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="summary">${escapeHtml(lc.summary || '')}</div>
    <div class="meta">
      <div>${escapeHtml(s.authorLabel)}${s.colon}${escapeHtml(lc.author || s.notProvided)}</div>
      ${lc.unit_owner ? `<div>${escapeHtml(s.ownerLabel)}${s.colon}${escapeHtml(lc.unit_owner)}</div>` : ''}
      ${c.updated ? `<div>${escapeHtml(flabel('updated'))}${s.colon}${escapeHtml(c.updated)}</div>` : ''}
    </div>
  `;

  card.appendChild(browserBar);
  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

/* ---------- 詳情頁（全頁切換，非覆蓋層） ---------- */

function youtubeEmbedUrl(url) {
  if (!url) return null;
  let m = url.match(/^https?:\/\/(?:www\.)?youtu\.be\/([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/embed\/([\w-]{11})/);
  if (!m) m = url.match(/^https?:\/\/(?:www\.)?youtube\.com\/shorts\/([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function renderDetail(c) {
  const lc = loc(c);
  const s = ui();
  const content = document.getElementById('detailContent');

  const metaItems = [
    [flabel('category'), (lc.category || []).join(s.listSep)],
    [flabel('unit_request'), lc.unit_request],
    [flabel('unit_owner'), lc.unit_owner],
    [flabel('author'), lc.author],
    [flabel('status'), lc.status],
    [flabel('region'), lc.region],
    [flabel('updated'), c.updated],
  ].filter(([, v]) => !isEmpty(v));

  const videoList = Array.isArray(c.video) ? c.video : (c.video ? [c.video] : []);
  const videoEmbeds = videoList.map(youtubeEmbedUrl).filter(Boolean);
  const galleryImages = Array.isArray(c.screenshots) ? c.screenshots.filter(Boolean) : [];
  const url = safeUrl(c.url);

  // 成效放最前面；其餘依「背景 → 做法 → 延伸」分組
  const highlights = field('results', lc.results) + field('value', lc.value);
  const groups = [
    (url ? `<section class="field"><h2 class="field-title">${escapeHtml(flabel('url'))}</h2><div class="text"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></div></section>` : '')
      + field('problem_background', lc.problem_background)
      + field('core_problem', lc.core_problem),
    field('solution', lc.solution)
      + field('process', lc.process)
      + field('features', lc.features)
      + field('ai_usage', lc.ai_usage)
      + field('tools', lc.tools),
    chipsField('extensions', lc.extensions)
      + field('limitations', lc.limitations)
      + field('success_key', lc.success_key)
      + chipsField('keywords', lc.keywords),
  ].filter(Boolean);

  const title = escapeHtml(lc.title);
  content.innerHTML = `
    ${videoEmbeds.map(src => `<div class="video-embed"><iframe src="${src}" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`).join('')}
    ${(galleryImages.length && !videoEmbeds.length) ? `
      <div class="gallery">
        <button type="button" class="gallery-main" id="galleryMain" aria-label="${escapeHtml(s.openImage)}"><img id="galleryMainImg" src="${escapeHtml(galleryImages[0])}" alt="${title}" /></button>
        ${galleryImages.length > 1 ? `<div class="gallery-thumbs">${galleryImages.map((src, i) => `<button type="button" class="gallery-thumb${i === 0 ? ' active' : ''}" data-idx="${i}" aria-label="${escapeHtml(s.imageN(i + 1, galleryImages.length))}" aria-pressed="${i === 0}">${thumbImg(src, '', 'lazy')}</button>`).join('')}</div>` : ''}
      </div>
    ` : ((c.screenshot && !videoEmbeds.length) ? `<div class="hero"><img src="${escapeHtml(c.screenshot)}" alt="${title}" /></div>` : '')}
    ${c.number ? `<div class="case-number">No.${escapeHtml(c.number)}</div>` : ''}
    <h1 class="detail-title" id="detailTitle" tabindex="-1">${title}</h1>
    ${lc.summary ? `<p class="subtitle">${escapeHtml(lc.summary)}</p>` : ''}

    ${metaItems.length ? `<dl class="meta-grid">${metaItems.map(([label, v]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(v)}</dd></div>`).join('')}</dl>` : ''}

    ${highlights ? `<div class="highlights" role="region" aria-label="${escapeHtml(s.highlightsLabel)}">${highlights}</div>` : ''}
    ${groups.map(g => `<div class="field-group">${g}</div>`).join('')}
  `;

  setupGallery(galleryImages, lc.title);
}

/* ---------- 圖片相簿 / 燈箱 ---------- */

let lightboxImages = [];
let lightboxIndex = 0;
let lightboxTitle = '';
let lightboxReturnFocus = null;

function setupGallery(images, title) {
  if (!images.length) return;
  const mainImg = document.getElementById('galleryMainImg');
  const thumbs = document.querySelectorAll('.gallery-thumb');
  thumbs.forEach(thumb => {
    thumb.addEventListener('click', () => {
      const idx = Number(thumb.dataset.idx);
      mainImg.src = images[idx];
      thumbs.forEach(t => {
        const on = t === thumb;
        t.classList.toggle('active', on);
        t.setAttribute('aria-pressed', on);
      });
    });
  });
  document.getElementById('galleryMain').addEventListener('click', () => {
    const activeThumb = document.querySelector('.gallery-thumb.active');
    openLightbox(images, activeThumb ? Number(activeThumb.dataset.idx) : 0, title);
  });
}

function openLightbox(images, index, title) {
  lightboxImages = images;
  lightboxIndex = index;
  lightboxTitle = title || '';
  lightboxReturnFocus = document.activeElement;
  renderLightbox();
  document.getElementById('lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('lightboxClose').focus();
}

function closeLightbox() {
  document.getElementById('lightbox').hidden = true;
  document.body.style.overflow = '';
  if (lightboxReturnFocus && document.contains(lightboxReturnFocus)) lightboxReturnFocus.focus();
  lightboxReturnFocus = null;
}

function lightboxNav(delta) {
  lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
}

function renderLightbox() {
  const n = lightboxImages.length;
  const img = document.getElementById('lightboxImg');
  img.src = lightboxImages[lightboxIndex];
  img.alt = n > 1 ? `${lightboxTitle}（${ui().imageN(lightboxIndex + 1, n)}）` : lightboxTitle;
  const counter = document.getElementById('lightboxCounter');
  counter.textContent = n > 1 ? `${lightboxIndex + 1} / ${n}` : '';
  counter.hidden = n <= 1;
  document.getElementById('lightboxPrev').hidden = n <= 1;
  document.getElementById('lightboxNext').hidden = n <= 1;
}

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => lightboxNav(-1));
document.getElementById('lightboxNext').addEventListener('click', () => lightboxNav(1));
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
window.addEventListener('keydown', (e) => {
  const lightbox = document.getElementById('lightbox');
  if (lightbox.hidden) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lightboxNav(-1);
  else if (e.key === 'ArrowRight') lightboxNav(1);
  else if (e.key === 'Tab') {
    // 焦點鎖在燈箱內
    const focusables = [...lightbox.querySelectorAll('button')].filter(b => !b.hidden);
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!lightbox.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- 頁面切換 ---------- */

let listScrollY = 0;
let lastCaseId = null;
let listScrollToTop = false;

function currentView() {
  if (!document.getElementById('detailView').hidden) return 'detail';
  if (!document.getElementById('leaderboardView').hidden) return 'leaderboard';
  return 'list';
}

function rememberListScroll() {
  if (currentView() === 'list') listScrollY = window.scrollY;
}

function showList() {
  const from = currentView();
  document.getElementById('listView').hidden = false;
  document.getElementById('detailView').hidden = true;
  document.getElementById('leaderboardView').hidden = true;
  if (listScrollToTop || from === 'list') {
    window.scrollTo(0, 0);
    listScrollToTop = false;
    return;
  }
  // 從案例返回：回到原本的捲動位置，焦點放回剛才那張卡片
  window.scrollTo(0, listScrollY);
  const link = lastCaseId && document.querySelector(`.card-link[href="#case/${CSS.escape(encodeURIComponent(lastCaseId))}"]`);
  if (link) link.focus({ preventScroll: true });
}

function showDetail(id) {
  const c = cases.find(x => x.id === id);
  if (!c) { showList(); return; }
  rememberListScroll();
  lastCaseId = id;
  renderDetail(c);
  document.getElementById('listView').hidden = true;
  document.getElementById('detailView').hidden = false;
  document.getElementById('leaderboardView').hidden = true;
  window.scrollTo(0, 0);
  document.getElementById('detailTitle').focus({ preventScroll: true });
}

function showLeaderboard() {
  rememberListScroll();
  renderLeaderboard();
  document.getElementById('listView').hidden = true;
  document.getElementById('detailView').hidden = true;
  document.getElementById('leaderboardView').hidden = false;
  window.scrollTo(0, 0);
}

function routeFromHash() {
  if (!document.getElementById('lightbox').hidden) closeLightbox();
  const m = location.hash.match(/^#case\/(.+)$/);
  if (m) { showDetail(decodeURIComponent(m[1])); return; }
  if (location.hash === '#leaderboard') { showLeaderboard(); return; }
  showList();
}

/* ---------- 排行榜：依負責單位統計案例數 ---------- */

function computeLeaderboard() {
  const counts = new Map();
  cases.forEach(c => {
    const unit = (loc(c).unit_owner || '').trim() || ui().notProvided;
    counts.set(unit, (counts.get(unit) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

function renderLeaderboard() {
  const s = ui();
  document.getElementById('leaderboardTitle').textContent = s.leaderboardTitle;
  document.getElementById('leaderboardSubtitle').textContent = s.leaderboardSubtitle;

  const ranking = computeLeaderboard();
  const rankClass = (i) => (i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '');

  const list = document.getElementById('leaderboardList');
  list.innerHTML = ranking.map(([unit, count], i) => `
    <button type="button" class="lb-row" data-unit="${escapeHtml(unit)}">
      <span class="lb-rank ${rankClass(i)}">${i + 1}</span>
      <span class="lb-name">${escapeHtml(unit)}</span>
      <span class="lb-count">${escapeHtml(s.caseCountLabel(count))}</span>
    </button>
  `).join('');

  list.querySelectorAll('.lb-row').forEach(row => {
    row.addEventListener('click', () => goToUnit(row.dataset.unit));
  });
}

function goToUnit(unit) {
  activeCategory = null;
  currentPage = 1;
  document.getElementById('search').value = unit === ui().notProvided ? '' : unit;
  syncSearchClear();
  renderCategoryFilters();
  render();
  listScrollToTop = true;
  location.hash = '';
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function safeUrl(url) {
  return /^https?:\/\//i.test(url || '') ? url : '';
}

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* 列表與小縮圖優先載入 assets/thumbs/ 的 WebP 縮圖（scripts/make_thumbs.py 產生），找不到就退回原圖 */
function thumbFor(src) {
  const m = /^assets\/(?:.*\/)?([^/]+)\.(?:png|jpe?g|webp)$/i.exec(src || '');
  return m ? `assets/thumbs/${m[1]}.webp` : src;
}

function thumbImg(src, alt, loading) {
  const small = thumbFor(src);
  const fallback = small !== src ? ` onerror="this.onerror=null;this.src='${escapeHtml(src)}'"` : '';
  return `<img src="${escapeHtml(small)}" alt="${escapeHtml(alt)}" loading="${loading}" decoding="async"${fallback} />`;
}

function syncSearchClear() {
  document.getElementById('searchClear').hidden = !document.getElementById('search').value;
}

document.getElementById('search').addEventListener('input', () => { syncSearchClear(); currentPage = 1; render(); });
document.getElementById('searchClear').addEventListener('click', () => {
  const search = document.getElementById('search');
  search.value = '';
  syncSearchClear();
  currentPage = 1;
  render();
  search.focus();
});
document.getElementById('pageTitle').addEventListener('click', (e) => {
  e.preventDefault();
  activeCategory = null;
  currentPage = 1;
  document.getElementById('search').value = '';
  syncSearchClear();
  renderCategoryFilters();
  render();
  if (location.hash) {
    listScrollToTop = true;
    history.pushState(null, '', location.pathname + location.search);
    routeFromHash();
  } else {
    window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
  }
});
document.getElementById('backBtn').addEventListener('click', () => { location.hash = ''; });
document.getElementById('leaderboardBackBtn').addEventListener('click', () => { location.hash = ''; });
document.getElementById('leaderboardBtn').addEventListener('click', () => { location.hash = 'leaderboard'; });
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});
window.addEventListener('hashchange', routeFromHash);

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

document.addEventListener('click', (e) => {
  const details = document.getElementById('changelogDetails');
  if (details.open && !details.contains(e.target)) {
    details.open = false;
  }
});
document.addEventListener('keydown', (e) => {
  const details = document.getElementById('changelogDetails');
  if (e.key === 'Escape' && details.open) {
    details.open = false;
    document.getElementById('versionBadge').focus();
  }
});

load();
</script>
